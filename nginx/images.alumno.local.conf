
map $arg_size $image_size {
    default 300;
    150     150;
    300     300;
    450     450;
    600     600;
}

map $arg_sharpen $image_sharpen {
    default 0;
    0       0;
    10      10;
    30      30;
    50      50;
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name images.alumno.local;

    return 301 https://images.alumno.local$request_uri;
}

# www -> nombre principal
server {
    listen 80;
    server_name www.images.alumno.local;

    return 301 https://images.alumno.local$request_uri;
}

# También redirige www si se accede directamente por HTTPS
server {
    listen 443 ssl;
    server_name www.images.alumno.local;

    ssl_certificate     /etc/ssl/dpl/images.alumno.local.crt;
    ssl_certificate_key /etc/ssl/dpl/images.alumno.local.key;

    return 301 https://images.alumno.local$request_uri;
}

# Sitio principal
server {
    listen 443 ssl;
    server_name images.alumno.local;

    ssl_certificate     /etc/ssl/dpl/images.alumno.local.crt;
    ssl_certificate_key /etc/ssl/dpl/images.alumno.local.key;

    root /var/www/images.alumno.local;
    index index.html;

    access_log /var/log/nginx/images-alumno.access.log combined;
    error_log  /var/log/nginx/images-alumno.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

# Primero se comprueba la autenticacion
    location /img/ {
        auth_basic "Galeria protegida";
        auth_basic_user_file /etc/nginx/images-users;

# Si la autenticacion es correcta, pasa al procesado
        try_files /archivo_que_no_existe @procesar_imagen;
     }

# Redireccion interna al filtro
    location @procesar_imagen {
        rewrite ^/img/(.*)$ /img/_procesada/$1 last;
     }

# Procesado real de la imagen
    location /img/_procesada/ {
        internal;

        alias /var/www/images.alumno.local/img/;

        image_filter_buffer 10M;
        image_filter resize $image_size $image_size;
        image_filter_sharpen $image_sharpen;
     }
}
